name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relythra_test
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: relythra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relythra_test -d relythra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELYTHRA_TEST_DATABASE_URL: postgres://relythra_test:ci-only-not-secret@127.0.0.1:5432/relythra_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Format, vet, test, and build
        run: make fmt-check vet test build case-check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: make web-install
      - name: Lint, typecheck, test, and build
        run: make web-check

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - frontend
    env:
      RELYTHRA_POSTGRES_PASSWORD: ci-only-not-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose, migrate, and probe services
        run: make smoke
      - name: Verify demo workload, telemetry, and isolation
        run: make demo-smoke
